<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar">
    <style>
        .layout {
            display: flex;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #f8fafc;
            border-right: 1px solid #e5e7eb;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 30px;
            color: #1e293b;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu a {
            text-decoration: none;
            color: #334155;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s, color 0.2s;
        }

        .menu a:hover {
            background: #e0e7ff;
            color: #1d4ed8;
        }

        .menu a.active {
            background: #3b82f6;
            color: white;
            font-weight: bold;
        }
    </style>

    <div class="sidebar">
        <h2>OnBid</h2>
        <div class="menu">
            <a href="/" th:classappend="${page == 'home'} ? 'active'">홈</a>
            <a href="/onbid" th:classappend="${page == 'onbid'} ? 'active'">물건 검색</a>
            <a href="/wishlist" th:classappend="${page == 'wishlist'} ? 'active'">내 찜목록</a>
            <a href="/login" th:unless="${session.username}">로그인</a>
            <a href="/register" th:unless="${session.username}">회원가입</a>
            <a href="/logout" th:if="${session.username}">로그아웃</a>
        </div>
    </div>
</div>
</body>
</html>
